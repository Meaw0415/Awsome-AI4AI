name: Build verified ref.bib

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata parsers
        run: pip install requests beautifulsoup4
      - name: Build bibliography
        run: python .github/scripts/build_ref_bib.py
      - name: Upload bibliography artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-ref-bib
          path: ref.bib
