name: Build verified ref.bib

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ref-bib.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata parsers
        run: pip install requests beautifulsoup4
      - name: Build bibliography
        run: python .github/scripts/build_ref_bib.py
      - name: Commit bibliography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ref.bib
          if git diff --cached --quiet; then
            echo "ref.bib unchanged"
          else
            git commit -m "Add verified ref.bib"
            git push
          fi
